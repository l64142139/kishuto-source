name: sync-kishuto

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source from CDN
        run: curl -fsSL "https://aka.doubaocdn.com/s/BFfOT4xKfF" -o kishuto.js && ls -l kishuto.js && head -c 80 kishuto.js
      - name: Commit
        run: |
          git config user.name  "kishuto-bot"
          git config user.email "kishuto-bot@users.noreply.github.com"
          git add kishuto.js
          git commit -m "sync kishuto.js [skip ci]" || echo "no change"
          git push

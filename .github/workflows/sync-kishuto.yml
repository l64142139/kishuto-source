name: sync-kishuto

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch files from CDN
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/ZbKOZg4lMP" -o server.mjs
          curl -fsSL "https://aka.doubaocdn.com/s/kC9ojN2Sm9" -o README.md
          curl -fsSL "https://aka.doubaocdn.com/s/lweTzYEuUO" -o package.json
          curl -fsSL "https://aka.doubaocdn.com/s/dNXBFVRAPY" -o Dockerfile
          ls -l

      - name: Commit
        run: |
          git config user.name  "kishuto-bot"
          git config user.email "kishuto-bot@users.noreply.github.com"
          git add server.mjs README.md package.json Dockerfile
          git commit -m "fix: m3u8 proxy + line ranking [skip ci]" || echo "no change"
          git push
